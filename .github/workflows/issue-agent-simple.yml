name: Issue Agent（简洁版）

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - name: 检查是否为PR
        run: |
          if [ -n "${{ github.event.issue.pull_request }}" ]; then
            echo "这是PR评论，跳过"
            exit 0
          fi
          echo "这是Issue评论，继续"
      
      - uses: actions/checkout@v3
      
      - name: 检查Agent状态
        id: check
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          AGENT_ID=$(gh issue view ${{ github.event.issue.number }} --json labels -q '.labels[].name' | grep '^agent:' | cut -d: -f2 || echo "")
          if [ -n "$AGENT_ID" ]; then
            echo "has_agent=true" >> $GITHUB_OUTPUT
            echo "agent_id=$AGENT_ID" >> $GITHUB_OUTPUT
          else
            echo "has_agent=false" >> $GITHUB_OUTPUT
          fi
      
      - name: 创建新Agent
        if: steps.check.outputs.has_agent == 'false'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          RESPONSE=$(curl -s -X POST "https://api.cursor.com/v1/agents" \
            -u "${CURSOR_API_KEY}:" \
            -H "Content-Type: application/json" \
            -d '{
              "prompt": {
                "text": "你好！我是Issue #${{ github.event.issue.number }} 的专属Agent。后续评论会自动发给我。"
              },
              "env": {
                "type": "cloud",
                "name": "llluchy/Agent-Automate"
              },
              "envVars": {
                "GH_TOKEN": "'"$GH_TOKEN"'"
              }
            }')
          
          AGENT_ID=$(echo "$RESPONSE" | jq -r '.agent.id')
          gh issue edit ${{ github.event.issue.number }} --add-label "agent:$AGENT_ID"
          gh issue comment ${{ github.event.issue.number }} --body "🤖 Agent已创建: $AGENT_ID"
      
      - name: Follow-up到已有Agent
        if: steps.check.outputs.has_agent == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          curl -s -X POST "https://api.cursor.com/v1/agents/${{ steps.check.outputs.agent_id }}/runs" \
            -u "${CURSOR_API_KEY}:" \
            -H "Content-Type: application/json" \
            -d '{
              "prompt": {
                "text": "${{ github.event.comment.body }}"
              }
            }'
          
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            -f content='rocket' || true
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
