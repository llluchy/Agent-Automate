name: Issue Agent（简洁版）

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - name: 检查是否为PR
        run: |
          if [ -n "${{ github.event.issue.pull_request }}" ]; then
            echo "这是PR评论，跳过"
            exit 0
          fi
          echo "这是Issue评论，继续"
      
      - uses: actions/checkout@v3
      
      - name: 检查Agent状态
        id: check
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # 从Issue评论中查找Agent ID
          AGENT_ID=$(gh issue view ${{ github.event.issue.number }} --json comments -q '.comments[].body' | grep -oP 'Agent ID: \Kbc-[a-f0-9-]+' | head -1 || echo "")
          if [ -n "$AGENT_ID" ]; then
            echo "has_agent=true" >> $GITHUB_OUTPUT
            echo "agent_id=$AGENT_ID" >> $GITHUB_OUTPUT
            echo "📱 找到已有Agent: $AGENT_ID"
          else
            echo "has_agent=false" >> $GITHUB_OUTPUT
            echo "🆕 尚无Agent"
          fi
      
      - name: 创建新Agent
        if: steps.check.outputs.has_agent == 'false'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "🚀 调用Cursor API创建Agent..."
          RESPONSE=$(curl -s -X POST "https://api.cursor.com/v1/agents" \
            -u "${CURSOR_API_KEY}:" \
            -H "Content-Type: application/json" \
            -d '{
              "prompt": {
                "text": "你好！我是Issue #${{ github.event.issue.number }} 的专属Agent。后续评论会自动发给我。"
              },
              "env": {
                "type": "cloud",
                "name": "Agent-Automate"
              },
              "envVars": {
                "GH_TOKEN": "'"$GH_TOKEN"'"
              }
            }')
          
          echo "📋 API响应:"
          echo "$RESPONSE" | jq '.'
          
          AGENT_ID=$(echo "$RESPONSE" | jq -r '.agent.id // empty')
          
          if [ -z "$AGENT_ID" ]; then
            echo "❌ 创建Agent失败，API返回:"
            echo "$RESPONSE"
            exit 1
          fi
          
          echo "✅ Agent创建成功: $AGENT_ID"
          gh issue comment ${{ github.event.issue.number }} --body "🤖 **Agent已关联此Issue**

Agent ID: $AGENT_ID
Agent URL: https://cursor.com/agents/$AGENT_ID

💡 后续在此Issue的评论会自动发送给Agent"
      
      - name: Follow-up到已有Agent
        if: steps.check.outputs.has_agent == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          curl -s -X POST "https://api.cursor.com/v1/agents/${{ steps.check.outputs.agent_id }}/runs" \
            -u "${CURSOR_API_KEY}:" \
            -H "Content-Type: application/json" \
            -d '{
              "prompt": {
                "text": "${{ github.event.comment.body }}"
              }
            }'
          
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            -f content='rocket' || true
