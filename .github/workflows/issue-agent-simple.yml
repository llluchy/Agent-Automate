name: Issue Agent

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - name: Check if PR
        run: |
          if [ -n "${{ github.event.issue.pull_request }}" ]; then
            exit 0
          fi
      
      - uses: actions/checkout@v3
      
      - name: Read config
        id: config
        run: |
          ENV_NAME=$(jq -r '.cursor.environment.name' .cursor/config.json)
          echo "env_name=$ENV_NAME" >> $GITHUB_OUTPUT
      
      - name: Check agent
        id: check
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          AGENT_ID=$(gh issue view ${{ github.event.issue.number }} --json comments -q '.comments[].body' | grep -oP 'Agent ID: \Kbc-[a-f0-9-]+' | head -1 || echo "")
          if [ -n "$AGENT_ID" ]; then
            echo "has_agent=true" >> $GITHUB_OUTPUT
            echo "agent_id=$AGENT_ID" >> $GITHUB_OUTPUT
          else
            echo "has_agent=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Create agent
        if: steps.check.outputs.has_agent == 'false'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          RESPONSE=$(curl -s -X POST "https://api.cursor.com/v1/agents" \
            -u "${CURSOR_API_KEY}:" \
            -H "Content-Type: application/json" \
            -d '{
              "prompt": {"text": "Hello, I am the agent for Issue #${{ github.event.issue.number }}"},
              "env": {"type": "cloud", "name": "${{ steps.config.outputs.env_name }}"},
              "envVars": {"GH_TOKEN": "'"$GH_TOKEN"'"}
            }')
          
          AGENT_ID=$(echo "$RESPONSE" | jq -r '.agent.id // empty')
          
          if [ -z "$AGENT_ID" ]; then
            echo "Create failed"
            echo "$RESPONSE"
            exit 1
          fi
          
          gh issue comment ${{ github.event.issue.number }} --body "Agent created. Agent ID: $AGENT_ID - URL: https://cursor.com/agents/$AGENT_ID"
      
      - name: Followup
        if: steps.check.outputs.has_agent == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          COMMENT: ${{ github.event.comment.body }}
        run: |
          curl -s -X POST "https://api.cursor.com/v1/agents/${{ steps.check.outputs.agent_id }}/runs" \
            -u "${CURSOR_API_KEY}:" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg text "$COMMENT" '{prompt: {text: $text}}')"
          
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            -f content='rocket' 2>/dev/null || true
