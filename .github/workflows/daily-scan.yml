name: 每日需求扫描

on:
  schedule:
    - cron: '0 1 * * *'  # 每天UTC 1:00 = 北京时间9:00
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: 扫描代码
        id: scan
        run: |
          echo "扫描TODO/FIXME..." > report.txt
          if grep -rn --exclude-dir=.git "TODO\|FIXME" . 2>/dev/null > todos.txt; then
            cat todos.txt >> report.txt
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "未发现待办事项" >> report.txt
            echo "found=false" >> $GITHUB_OUTPUT
          fi
      
      - name: 创建Issue
        if: steps.scan.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "[AI扫描] $(date +%Y-%m-%d) 发现待办事项" \
            --body "$(cat report.txt)" \
            --label "ai-proposed"
