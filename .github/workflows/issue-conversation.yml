name: Issue对话（自动Agent）

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  agent-conversation:
    # 排除PR评论（PR单独处理）
    if: '!github.event.issue.pull_request'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: 检查Issue是否已有Agent
        id: check
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          ISSUE_NUM=${{ github.event.issue.number }}
          
          # 从标签中提取Agent ID
          AGENT_ID=$(gh issue view $ISSUE_NUM --json labels -q '.labels[].name' | grep '^agent:' | cut -d: -f2 || echo "")
          
          if [ -n "$AGENT_ID" ]; then
            echo "has_agent=true" >> $GITHUB_OUTPUT
            echo "agent_id=$AGENT_ID" >> $GITHUB_OUTPUT
            echo "📱 发现已关联Agent: $AGENT_ID"
          else
            echo "has_agent=false" >> $GITHUB_OUTPUT
            echo "🆕 Issue尚未关联Agent，将创建新Agent"
          fi
          
          # 获取Issue标题和内容
          ISSUE_TITLE=$(gh issue view $ISSUE_NUM --json title -q .title)
          ISSUE_BODY=$(gh issue view $ISSUE_NUM --json body -q .body)
          
          echo "issue_title<<EOF" >> $GITHUB_OUTPUT
          echo "$ISSUE_TITLE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "issue_body<<EOF" >> $GITHUB_OUTPUT
          echo "$ISSUE_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: 读取环境配置
        id: config
        run: |
          ENV_ENABLED=$(jq -r '.cursor.environment.enabled // false' .cursor/config.json)
          if [ "$ENV_ENABLED" = "true" ]; then
            ENV_TYPE=$(jq -r '.cursor.environment.type' .cursor/config.json)
            ENV_NAME=$(jq -r '.cursor.environment.name' .cursor/config.json)
            echo "env_enabled=true" >> $GITHUB_OUTPUT
            echo "env_type=$ENV_TYPE" >> $GITHUB_OUTPUT
            echo "env_name=$ENV_NAME" >> $GITHUB_OUTPUT
          else
            echo "env_enabled=false" >> $GITHUB_OUTPUT
          fi
      
      - name: 创建新Agent（首次评论）
        if: steps.check.outputs.has_agent == 'false'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # 构建初始prompt（包含Issue标题和内容）
          PROMPT_TEXT="你好！我是这个Issue的专属Agent。

**Issue标题:** ${{ steps.check.outputs.issue_title }}

**Issue描述:**
${{ steps.check.outputs.issue_body }}

**用户评论:**
${{ github.event.comment.body || '（Issue刚创建）' }}

---

我现在的工作模式：
1. 我们可以先讨论需求、设计方案
2. 你随时可以问我问题，我会基于这个仓库的代码回答
3. 当你确认需求后，明确告诉我\"开始开发\"
4. 我会创建分支、编写代码、运行测试、创建PR
5. PR创建后，你继续在这个Issue评论，我会持续优化

让我们开始吧！你有什么想法？"

          # 构建payload
          if [ "${{ steps.config.outputs.env_enabled }}" = "true" ]; then
            PAYLOAD=$(jq -n \
              --arg prompt "$PROMPT_TEXT" \
              --arg token "$GH_TOKEN" \
              --arg env_type "${{ steps.config.outputs.env_type }}" \
              --arg env_name "${{ steps.config.outputs.env_name }}" \
              '{
                prompt: { text: $prompt },
                env: { type: $env_type, name: $env_name },
                envVars: { GH_TOKEN: $token }
              }')
          else
            PAYLOAD=$(jq -n \
              --arg prompt "$PROMPT_TEXT" \
              --arg repo "https://github.com/${{ github.repository }}" \
              --arg token "$GH_TOKEN" \
              '{
                prompt: { text: $prompt },
                repos: [{ url: $repo, startingRef: "main" }],
                envVars: { GH_TOKEN: $token }
              }')
          fi
          
          RESPONSE=$(curl -X POST "https://api.cursor.com/v1/agents" \
            -u "${CURSOR_API_KEY}:" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          
          AGENT_ID=$(echo "$RESPONSE" | jq -r '.agent.id')
          AGENT_URL=$(echo "$RESPONSE" | jq -r '.agent.url')
          RUN_ID=$(echo "$RESPONSE" | jq -r '.run.id')
          
          echo "agent_id=$AGENT_ID" >> $GITHUB_OUTPUT
          echo "agent_url=$AGENT_URL" >> $GITHUB_OUTPUT
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
        id: create
      
      - name: 关联Agent到Issue
        if: steps.check.outputs.has_agent == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # 添加agent标签
          gh issue edit ${{ github.event.issue.number }} \
            --add-label "agent:${{ steps.create.outputs.agent_id }}"
          
          # 回复确认
          gh issue comment ${{ github.event.issue.number }} \
            --body "🤖 **Agent已关联此Issue**

📱 Agent: [\`${{ steps.create.outputs.agent_id }}\`](${{ steps.create.outputs.agent_url }})

---

💡 **使用说明：**

在这个Issue的任何评论都会自动发送给我。我们可以：

1. 📋 **讨论需求** - 随时问我问题，探讨实现方案
2. 🔍 **分析代码** - 我可以查看和分析现有代码
3. 💻 **开始开发** - 确认后告诉我\"开始开发\"，我会创建PR
4. 🔄 **持续优化** - PR创建后继续在此对话，我会更新PR

让我们开始吧！"
      
      - name: 发送Follow-up（后续评论）
        if: steps.check.outputs.has_agent == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          COMMENT_TEXT="${{ github.event.comment.body }}"
          
          PAYLOAD=$(jq -n \
            --arg prompt "$COMMENT_TEXT" \
            '{
              prompt: { text: $prompt }
            }')
          
          RESPONSE=$(curl -X POST "https://api.cursor.com/v1/agents/${{ steps.check.outputs.agent_id }}/runs" \
            -u "${CURSOR_API_KEY}:" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          
          RUN_ID=$(echo "$RESPONSE" | jq -r '.run.id')
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
        id: followup
      
      - name: 确认Follow-up（静默）
        if: steps.check.outputs.has_agent == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # 添加reaction表示已发送（不发评论，避免刷屏）
          COMMENT_ID=${{ github.event.comment.id }}
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/issues/comments/$COMMENT_ID/reactions \
            -f content='rocket'
