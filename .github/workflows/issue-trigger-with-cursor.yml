name: Issue触发Cursor开发

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  trigger-cursor:
    if: contains(github.event.comment.body, '/approve')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: 读取配置和Prompt
        id: config
        run: |
          # 读取环境配置
          ENV_ENABLED=$(jq -r '.cursor.environment.enabled // false' .cursor/config.json)
          if [ "$ENV_ENABLED" = "true" ]; then
            ENV_TYPE=$(jq -r '.cursor.environment.type' .cursor/config.json)
            ENV_NAME=$(jq -r '.cursor.environment.name' .cursor/config.json)
            echo "env_enabled=true" >> $GITHUB_OUTPUT
            echo "env_type=$ENV_TYPE" >> $GITHUB_OUTPUT
            echo "env_name=$ENV_NAME" >> $GITHUB_OUTPUT
          else
            echo "env_enabled=false" >> $GITHUB_OUTPUT
          fi
          
          # 读取并处理Prompt
          PROMPT_TEMPLATE=$(cat .cursor/prompts/issue-develop.txt)
          PROMPT_TEXT="${PROMPT_TEMPLATE//\{\{ISSUE_NUMBER\}\}/${{ github.event.issue.number }}}"
          echo "prompt<<EOF" >> $GITHUB_OUTPUT
          echo "$PROMPT_TEXT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: 调用Cursor API
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          PROMPT_TEXT=$(cat <<'PROMPT_EOF'
          ${{ steps.config.outputs.prompt }}
          PROMPT_EOF
          )
          
          # 构建payload（使用environment时不能指定repos）
          if [ "${{ steps.config.outputs.env_enabled }}" = "true" ]; then
            PAYLOAD=$(jq -n \
              --arg prompt "$PROMPT_TEXT" \
              --arg token "$GH_TOKEN" \
              --arg env_type "${{ steps.config.outputs.env_type }}" \
              --arg env_name "${{ steps.config.outputs.env_name }}" \
              '{
                prompt: { text: $prompt },
                env: { type: $env_type, name: $env_name },
                autoCreatePR: true,
                envVars: { GH_TOKEN: $token }
              }')
          else
            PAYLOAD=$(jq -n \
              --arg prompt "$PROMPT_TEXT" \
              --arg repo "https://github.com/${{ github.repository }}" \
              --arg token "$GH_TOKEN" \
              '{
                prompt: { text: $prompt },
                repos: [{ url: $repo, startingRef: "main" }],
                autoCreatePR: true,
                envVars: { GH_TOKEN: $token }
              }')
          fi
          
          RESPONSE=$(curl -X POST "https://api.cursor.com/v1/agents" \
            -u "${CURSOR_API_KEY}:" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          
          # 提取Agent URL
          AGENT_URL=$(echo "$RESPONSE" | jq -r '.agent.url // "启动中"')
          echo "agent_url=${AGENT_URL}" >> $GITHUB_OUTPUT
        id: cursor
      
      - name: 回复确认
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --body "✅ Cursor Agent已启动

Agent链接: ${{ steps.cursor.outputs.agent_url }}

Agent将自动开发此Issue"
