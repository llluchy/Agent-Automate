name: Issue触发Cursor开发

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  trigger-cursor:
    if: contains(github.event.comment.body, '/approve')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: 读取并处理Prompt
        id: prompt
        run: |
          PROMPT_TEMPLATE=$(cat .cursor/prompts/issue-develop.txt)
          PROMPT_TEXT="${PROMPT_TEMPLATE//\{\{ISSUE_NUMBER\}\}/${{ github.event.issue.number }}}"
          echo "prompt<<EOF" >> $GITHUB_OUTPUT
          echo "$PROMPT_TEXT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: 调用Cursor API
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PROMPT_TEXT=$(cat <<'PROMPT_EOF'
          ${{ steps.prompt.outputs.prompt }}
          PROMPT_EOF
          )
          
          PAYLOAD=$(jq -n \
            --arg prompt "$PROMPT_TEXT" \
            --arg repo "https://github.com/${{ github.repository }}" \
            --arg token "$GH_TOKEN" \
            '{
              prompt: { text: $prompt },
              repos: [{ url: $repo, startingRef: "main" }],
              autoCreatePR: true,
              envVars: { GH_TOKEN: $token }
            }')
          
          RESPONSE=$(curl -X POST "https://api.cursor.com/v1/agents" \
            -u "${CURSOR_API_KEY}:" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          
          # 提取Agent URL
          AGENT_URL=$(echo "$RESPONSE" | jq -r '.agent.url // "启动中"')
          echo "agent_url=${AGENT_URL}" >> $GITHUB_OUTPUT
        id: cursor
      
      - name: 回复确认
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --body "✅ Cursor Agent已启动

Agent链接: ${{ steps.cursor.outputs.agent_url }}

Agent将自动开发此Issue"
