name: Issue触发开发

on:
  issue_comment:
    types: [created]

jobs:
  trigger:
    if: contains(github.event.comment.body, '/approve')
    runs-on: ubuntu-latest
    
    steps:
      - name: 添加触发标签
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit ${{ github.event.issue.number }} --add-label "cursor-approved"
      
      - name: 回复确认
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "✅ 已添加 cursor-approved 标签，Cursor Agent将开始开发"
