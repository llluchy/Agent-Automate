name: Issue Agent对话（v2）

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  agent-conversation:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检查是否为PR（提前退出）
        run: |
          echo "事件类型: ${{ github.event_name }}"
          echo "Issue编号: ${{ github.event.issue.number }}"
          if [ "${{ github.event.issue.pull_request }}" != "" ]; then
            echo "这是PR，跳过"
            exit 0
          fi
          echo "这是Issue，继续处理"
      
      - uses: actions/checkout@v3
      
      - name: 检查Issue是否已有Agent
        id: check
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          ISSUE_NUM=${{ github.event.issue.number }}
          
          # 从标签中提取Agent ID
          AGENT_ID=$(gh issue view $ISSUE_NUM --json labels -q '.labels[].name' | grep '^agent:' | cut -d: -f2 || echo "")
          
          if [ -n "$AGENT_ID" ]; then
            echo "has_agent=true" >> $GITHUB_OUTPUT
            echo "agent_id=$AGENT_ID" >> $GITHUB_OUTPUT
            echo "📱 发现已关联Agent: $AGENT_ID"
          else
            echo "has_agent=false" >> $GITHUB_OUTPUT
            echo "🆕 Issue尚未关联Agent"
          fi
      
      - name: 读取环境配置
        id: config
        run: |
          ENV_ENABLED=$(jq -r '.cursor.environment.enabled // false' .cursor/config.json)
          if [ "$ENV_ENABLED" = "true" ]; then
            ENV_TYPE=$(jq -r '.cursor.environment.type' .cursor/config.json)
            ENV_NAME=$(jq -r '.cursor.environment.name' .cursor/config.json)
            echo "env_enabled=true" >> $GITHUB_OUTPUT
            echo "env_type=$ENV_TYPE" >> $GITHUB_OUTPUT
            echo "env_name=$ENV_NAME" >> $GITHUB_OUTPUT
          else
            echo "env_enabled=false" >> $GITHUB_OUTPUT
          fi
      
      - name: 准备Prompt
        id: prompt
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          ISSUE_NUM=${{ github.event.issue.number }}
          ISSUE_TITLE=$(gh issue view $ISSUE_NUM --json title -q .title)
          ISSUE_BODY=$(gh issue view $ISSUE_NUM --json body -q .body)
          COMMENT_BODY="${{ github.event.comment.body }}"
          
          if [ "${{ steps.check.outputs.has_agent }}" = "false" ]; then
            # 首次创建Agent的prompt
            PROMPT_TEXT="你好！我是Issue #${ISSUE_NUM} 的专属Agent。

**Issue:** ${ISSUE_TITLE}

**描述:** ${ISSUE_BODY}

**用户评论:** ${COMMENT_BODY:-（Issue刚创建）}

---
我们可以先讨论需求，确认后我会开发。你有什么想法？"
          else
            # Follow-up的prompt
            PROMPT_TEXT="${COMMENT_BODY}"
          fi
          
          echo "prompt<<EOF" >> $GITHUB_OUTPUT
          echo "$PROMPT_TEXT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: 调用Cursor API
        id: cursor
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          PROMPT_TEXT=$(cat <<'PROMPT_EOF'
${{ steps.prompt.outputs.prompt }}
PROMPT_EOF
)
          
          if [ "${{ steps.check.outputs.has_agent }}" = "false" ]; then
            # 创建新Agent
            echo "🆕 创建新Agent..."
            
            if [ "${{ steps.config.outputs.env_enabled }}" = "true" ]; then
              PAYLOAD=$(jq -n \
                --arg prompt "$PROMPT_TEXT" \
                --arg token "$GH_TOKEN" \
                --arg env_type "${{ steps.config.outputs.env_type }}" \
                --arg env_name "${{ steps.config.outputs.env_name }}" \
                '{
                  prompt: { text: $prompt },
                  env: { type: $env_type, name: $env_name },
                  envVars: { GH_TOKEN: $token }
                }')
            else
              PAYLOAD=$(jq -n \
                --arg prompt "$PROMPT_TEXT" \
                --arg repo "https://github.com/${{ github.repository }}" \
                --arg token "$GH_TOKEN" \
                '{
                  prompt: { text: $prompt },
                  repos: [{ url: $repo, startingRef: "main" }],
                  envVars: { GH_TOKEN: $token }
                }')
            fi
            
            RESPONSE=$(curl -s -X POST "https://api.cursor.com/v1/agents" \
              -u "${CURSOR_API_KEY}:" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
            
            AGENT_ID=$(echo "$RESPONSE" | jq -r '.agent.id // "error"')
            AGENT_URL=$(echo "$RESPONSE" | jq -r '.agent.url // "error"')
            
            if [ "$AGENT_ID" = "error" ]; then
              echo "❌ 创建Agent失败"
              echo "$RESPONSE"
              exit 1
            fi
            
            echo "agent_id=$AGENT_ID" >> $GITHUB_OUTPUT
            echo "agent_url=$AGENT_URL" >> $GITHUB_OUTPUT
            echo "is_new=true" >> $GITHUB_OUTPUT
            
            # 添加标签
            gh issue edit ${{ github.event.issue.number }} --add-label "agent:$AGENT_ID"
            
          else
            # Follow-up到已有Agent
            echo "📨 发送follow-up到Agent ${{ steps.check.outputs.agent_id }}"
            
            PAYLOAD=$(jq -n --arg prompt "$PROMPT_TEXT" '{ prompt: { text: $prompt } }')
            
            curl -s -X POST "https://api.cursor.com/v1/agents/${{ steps.check.outputs.agent_id }}/runs" \
              -u "${CURSOR_API_KEY}:" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD"
            
            echo "is_new=false" >> $GITHUB_OUTPUT
          fi
      
      - name: 回复确认
        if: steps.cursor.outputs.is_new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --body "🤖 **Agent已关联**

Agent: [\`${{ steps.cursor.outputs.agent_id }}\`](${{ steps.cursor.outputs.agent_url }})

💡 后续在此Issue的评论会自动发送给Agent"
      
      - name: 添加Reaction（follow-up）
        if: steps.cursor.outputs.is_new == 'false' && github.event.comment.id
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            -f content='rocket' || true
