name: 每日需求挖掘

on:
  schedule:
    # 每天 UTC 00:00 = 北京时间 08:00。GitHub 只用 5 段 cron，不支持秒和 ?
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  trigger-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: 读取配置和检查Agent状态
        id: config
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # 读取环境配置
          ENV_ENABLED=$(jq -r '.cursor.environment.enabled // false' .cursor/config.json)
          if [ "$ENV_ENABLED" = "true" ]; then
            ENV_TYPE=$(jq -r '.cursor.environment.type' .cursor/config.json)
            ENV_NAME=$(jq -r '.cursor.environment.name' .cursor/config.json)
            echo "env_enabled=true" >> $GITHUB_OUTPUT
            echo "env_type=$ENV_TYPE" >> $GITHUB_OUTPUT
            echo "env_name=$ENV_NAME" >> $GITHUB_OUTPUT
          else
            echo "env_enabled=false" >> $GITHUB_OUTPUT
          fi
          
          # 检查是否已存在Scanning Agent
          SCANNING_AGENT_ID=$(gh variable get SCANNING_AGENT_ID 2>/dev/null || echo "")
          if [ -n "$SCANNING_AGENT_ID" ]; then
            echo "has_agent=true" >> $GITHUB_OUTPUT
            echo "agent_id=$SCANNING_AGENT_ID" >> $GITHUB_OUTPUT
            echo "📊 发现已有Scanning Agent: $SCANNING_AGENT_ID"
          else
            echo "has_agent=false" >> $GITHUB_OUTPUT
            echo "🆕 首次运行，将创建新Scanning Agent"
          fi
          
          # 读取Prompt
          PROMPT=$(cat .cursor/prompts/daily-scan.txt)
          echo "prompt<<EOF" >> $GITHUB_OUTPUT
          echo "$PROMPT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: 创建新Scanning Agent（首次运行）
        if: steps.config.outputs.has_agent == 'false'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          PROMPT_TEXT=$(cat <<'PROMPT_EOF'
          ${{ steps.config.outputs.prompt }}
          PROMPT_EOF
          )
          
          # 构建payload
          if [ "${{ steps.config.outputs.env_enabled }}" = "true" ]; then
            PAYLOAD=$(jq -n \
              --arg prompt "$PROMPT_TEXT" \
              --arg token "$GH_TOKEN" \
              --arg env_type "${{ steps.config.outputs.env_type }}" \
              --arg env_name "${{ steps.config.outputs.env_name }}" \
              '{
                prompt: { text: $prompt },
                env: { type: $env_type, name: $env_name },
                envVars: { GH_TOKEN: $token }
              }')
          else
            PAYLOAD=$(jq -n \
              --arg prompt "$PROMPT_TEXT" \
              --arg repo "https://github.com/${{ github.repository }}" \
              --arg token "$GH_TOKEN" \
              '{
                prompt: { text: $prompt },
                repos: [{ url: $repo, startingRef: "main" }],
                envVars: { GH_TOKEN: $token }
              }')
          fi
          
          RESPONSE=$(curl -X POST "https://api.cursor.com/v1/agents" \
            -u "${CURSOR_API_KEY}:" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          
          # 提取并保存Agent ID
          AGENT_ID=$(echo "$RESPONSE" | jq -r '.agent.id')
          AGENT_URL=$(echo "$RESPONSE" | jq -r '.agent.url')
          
          echo "agent_id=$AGENT_ID" >> $GITHUB_OUTPUT
          echo "agent_url=$AGENT_URL" >> $GITHUB_OUTPUT
          
          echo "🎉 创建新Scanning Agent: $AGENT_ID"
          echo "📍 Agent URL: $AGENT_URL"
        id: create_agent
      
      - name: 保存Scanning Agent ID
        if: steps.config.outputs.has_agent == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh variable set SCANNING_AGENT_ID --body "${{ steps.create_agent.outputs.agent_id }}"
          echo "✅ Agent ID已保存到Repository Variables"
      
      - name: Follow-up到已有Agent（后续运行）
        if: steps.config.outputs.has_agent == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          PROMPT_TEXT=$(cat <<'PROMPT_EOF'
          ${{ steps.config.outputs.prompt }}
          PROMPT_EOF
          )
          
          PAYLOAD=$(jq -n \
            --arg prompt "$PROMPT_TEXT" \
            '{
              prompt: { text: $prompt }
            }')
          
          RESPONSE=$(curl -X POST "https://api.cursor.com/v1/agents/${{ steps.config.outputs.agent_id }}/runs" \
            -u "${CURSOR_API_KEY}:" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          
          RUN_ID=$(echo "$RESPONSE" | jq -r '.run.id')
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          
          echo "📨 已发送follow-up到Scanning Agent"
          echo "🏃 New Run ID: $RUN_ID"
        id: followup_agent
