name: 每日需求挖掘

on:
  schedule:
    - cron: '0 1 * * *'  # 每天UTC 1:00 = 北京9:00
  workflow_dispatch:  # 手动触发

permissions:
  contents: read
  issues: write

jobs:
  trigger-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: 读取Prompt
        id: prompt
        run: |
          PROMPT=$(cat .cursor/prompts/daily-scan.txt)
          echo "prompt<<EOF" >> $GITHUB_OUTPUT
          echo "$PROMPT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: 调用Cursor Agent分析需求
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          PROMPT_TEXT=$(cat <<'PROMPT_EOF'
          ${{ steps.prompt.outputs.prompt }}
          PROMPT_EOF
          )
          
          PAYLOAD=$(jq -n \
            --arg prompt "$PROMPT_TEXT" \
            --arg repo "https://github.com/${{ github.repository }}" \
            --arg token "$GH_TOKEN" \
            '{
              prompt: { text: $prompt },
              repos: [{ url: $repo, startingRef: "main" }],
              envVars: { GH_TOKEN: $token }
            }')
          
          curl -X POST "https://api.cursor.com/v1/agents" \
            -u "${CURSOR_API_KEY}:" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
