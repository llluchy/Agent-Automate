name: 每日需求扫描（简化版）

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: 扫描并创建Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 扫描TODO/FIXME
          if grep -rn --exclude-dir=.git "TODO\|FIXME" . > todos.txt 2>/dev/null; then
            # 创建Issue并添加标签
            gh issue create \
              --title "[AI扫描] $(date +%Y-%m-%d) 待办事项" \
              --body "$(cat todos.txt)" \
              --label "ai-proposed,cursor-trigger"
          fi
